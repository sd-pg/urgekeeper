<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<style>
  /* Palette lifted from the app's own tokens (DesignSystem/Theme.swift) so the
     web pages read as the same product. Warm neutrals, never pure grey. */
  :root {
    --ground:  #F7F0E6;
    --surface: #FCF8F1;
    --ink:     #2A1D18;
    --ink-2:   #574941;
    --ink-3:   #8C7C72;
    --hair:    #E2D6C6;
    --accent:  #E8543C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:  #221812;
      --surface: #2B1F18;
      --ink:     #F4EDE3;
      --ink-2:   #D5C5B7;
      --ink-3:   #A8968A;
      --hair:    #43322A;
      --accent:  #FF8570;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 24px 80px;
    background: var(--ground);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 40rem; margin: 0 auto; }

  header {
    padding: 40px 0 8px;
    font-size: 14px;
    letter-spacing: .02em;
  }
  header a {
    color: var(--ink-3);
    text-decoration: none;
    font-weight: 600;
  }
  header a:hover { color: var(--accent); }

  h1, h2, h3 {
    font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    font-weight: 500;
    line-height: 1.2;
    text-wrap: balance;
  }
  h1 { font-size: clamp(30px, 5.5vw, 40px); margin: 28px 0 18px; letter-spacing: -.015em; }
  h2 { font-size: 25px; margin: 48px 0 12px; }
  h3 { font-size: 19px; margin: 32px 0 8px; font-weight: 600; }

  p, li { color: var(--ink-2); }
  strong { color: var(--ink); font-weight: 600; }

  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }

  hr { border: 0; height: 1px; background: var(--hair); margin: 40px 0; }

  /* Wide content must scroll inside itself, never the page body. */
  .table-scroll, table { display: block; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 15px; }
  th, td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--hair); }
  th { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }

  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .86em;
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 4px;
    padding: 1px 5px;
  }

  blockquote {
    margin: 24px 0;
    padding: 2px 0 2px 18px;
    border-left: 2px solid var(--hair);
    color: var(--ink-3);
  }

  footer {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--hair);
    font-size: 14px;
    color: var(--ink-3);
  }
  footer a { color: var(--ink-3); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <header><a href="./">{{ site.title }}</a></header>
    <main>
      {{ content }}
    </main>
    <footer>
      <a href="privacy.html">Privacy</a> ·
      <a href="support.html">Support</a>
    </footer>
  </div>
</body>
</html>
